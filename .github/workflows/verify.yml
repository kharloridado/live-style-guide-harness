# Verify — the deterministic half of the loop's gate, re-run on every push.
#
# NEEDS NO SECRETS AND NO API KEY. The expensive judgment ("is this right?" — the
# render vs the frozen Figma ref) happens once, at build time, by the checker, and is
# frozen into each item's specs/<kind>/<id>/measurements.json. CI only asks the narrower
# question "did this change?", which is arithmetic.
#
# The browser is the Chrome already installed on the GitHub runner image, reached
# through playwright-core's `channel` — no browser download, no cache to warm.
name: verify

# Pull requests and main only: a branch with no PR does not run, and a PR commit runs once.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The template itself holds <<PLACEHOLDER>> values by design, so the config-dependent steps
      # skip on a repo GitHub flags as a template. A generated project is never flagged.
      IS_TEMPLATE: ${{ github.event.repository.is_template == true }}
    steps:
      - uses: actions/checkout@v4
        with:
              # vendor/outsystems-ui: the framework base every specimen page stacks under the theme.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Proves the harness works (browser, server, probes) independently of project state.
      - name: gate self-test
        run: npm run gate:selftest

      # The drift guard: no surviving <<PLACEHOLDER>>, no leaked example prefix,
      # no project-scope OutSystems MCP entry shadowing OutSystems' plugin.
      # Skipped only on the template itself — see IS_TEMPLATE above.
      - name: check:config
        if: env.IS_TEMPLATE != 'true'
        run: npm run check:config

      # Every hand-edited stylesheet closes its blocks; an unclosed rule silently drops the rest.
      - name: check:stylesheets
        run: npm run check:stylesheets

      # Must run before build:theme: validate-theme resolves the framework tokens that block
      # overrides borrow against this compiled base. Anything that reads it belongs below.
      - name: build:osui
        run: npm run build:osui

      # Assemble dist/theme.css, validate every var() against tokens + framework base, then the
      # token audit. Chains check:config, so it skips on the template.
      - name: build:theme
        if: env.IS_TEMPLATE != 'true'
        run: npm run build:theme

      # Re-measure every committed probes.json against its baseline. No-ops with no items.
      - name: fidelity regression
        run: npm run gate:regression

      # Evidence, not a gate: the library review page, non-blocking.
      - name: review page
        if: always() && env.IS_TEMPLATE != 'true'
        continue-on-error: true
        run: npm run review

      - name: upload review
        if: always() && env.IS_TEMPLATE != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: review
          path: review/index.html
          if-no-files-found: ignore
          retention-days: 14
